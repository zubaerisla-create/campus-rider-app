spring.application.name=campus-rider
server.port=${PORT:8080}

# ---- Campus Rider ----------------------------------------------------------
# CSV data folder, relative to where the server is started (backend/ -> ../data)
campusrider.data-dir=${CAMPUSRIDER_DATA_DIR:../data}
campusrider.max-detour-meters=750
campusrider.max-pickup-meters=2500
campusrider.offer-timeout-seconds=60
campusrider.search-timeout-seconds=180
campusrider.simulation-speed-mps=45
campusrider.simulation-tick-ms=500
campusrider.allowed-origins=${CAMPUSRIDER_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Sessions (HttpOnly cookie, never readable from JavaScript) -------------
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=CR_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CAMPUSRIDER_SECURE_COOKIES:false}
server.servlet.session.tracking-modes=cookie

# Never leak stack traces or exception messages through the default error page
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
